# GitHub Actions — Maestro mobile tests
#
# Manual-trigger by design: mobile UI flows need an emulator/simulator AND an
# app binary (APP_ID) — neither ships in this repo. Wire in Maestro Cloud
# (MAESTRO_CLOUD_API_KEY secret) or an emulator+APK job, then flip the
# trigger to push/PR paths.

name: Maestro Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which flows to run'
        required: false
        default: '.maestro/flows/smoke/'

jobs:
  maestro-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run smoke tests
        run: |
          maestro test --env APP_ID=com.example.app "${{ github.event.inputs.suite || '.maestro/flows/smoke/' }}"

  maestro-full:
    runs-on: ubuntu-latest
    needs: maestro-smoke
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run full suite
        run: |
          make test-all APP_ID=com.example.app

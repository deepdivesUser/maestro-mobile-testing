# Auth: Login with invalid credentials shows error

appId: ${APP_ID:-com.example.app}

- launchApp
- tapOn: "Log in"  # <-- Change to match your app
- assertVisible: "Email"
- inputText: "invalid@example.com"
- tapOn: "Password"
- inputText: "wrongpassword"
- tapOn: "Sign in"
- assertVisible: "Invalid"  # <-- Change to match your error message
- runFlow: ".maestro/flows/common/assert-no-crash-dialog.yaml"

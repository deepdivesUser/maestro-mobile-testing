# Smoke: Home screen renders key elements

appId: ${APP_ID:-com.example.app}

- launchApp
- runFlow: ".maestro/flows/common/skip-onboarding.yaml"
- assertVisible: "Home"  # <-- Change to match your app
- assertVisible: "Search"  # <-- Change to match your app
- runFlow: ".maestro/flows/common/assert-no-crash-dialog.yaml"
